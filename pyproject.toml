[project]
name = "calendar-sidebar"
version = "0.1.0"
description = "Always-on-top Windows desktop sidebar showing today's Google Calendar events"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "PyQt6>=6.7",
  "PyQt6-WebEngine>=6.7",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "google-auth>=2.38",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.166",
  "python-dotenv>=1.0",
  "loguru>=0.7",
]
